<title>Mylingo Quiz</title><style>
:root{--brand:#1959d1;--brand-dark:#0e45ae;--brand-soft:#eaf1fc;--success:#58cc02;--success-dark:#46a302;--success-soft:#e9f8df;--ink:#17212b;--muted:#4b5563;--line:#e5e7eb;--bg:#f7f9fc;--error:#ff4b4b;--error-soft:#fff0f0;--ease-spring:cubic-bezier(0.175,0.885,0.32,1.275);--ease-out:cubic-bezier(0.16,1,0.3,1);--ease-standard:cubic-bezier(0.4,0,0.2,1);--question-card-radius:24px;--media-card-radius:18px;--audio-card-radius:16px;--image-card-radius:18px;--option-radius:14px;--ease-micro:cubic-bezier(0.25,0.1,0.25,1);--ease-emphasis:cubic-bezier(0.32,0.72,0,1);--ease-exit:cubic-bezier(0.4,0,1,1);--ease-release:cubic-bezier(0.34,1.56,0.64,1);--dur-micro:120ms;--dur-standard:220ms;--dur-emphasis:380ms}

.feedback{display:none;margin-top:14px;padding:14px 16px;border-radius:18px;line-height:1.5}.feedback-status{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}.feedback-icon{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.next,.primary{border:0;background:var(--brand);color:#fff;font-weight:900;padding:14px 30px;border-radius:999px;box-shadow:0 5px 0 var(--brand-dark);cursor:pointer;font-size:15px;min-height:48px;will-change:transform;transition:transform var(--dur-standard) var(--ease-release),box-shadow var(--dur-micro) var(--ease-micro),opacity var(--dur-emphasis) var(--ease-out)}

.next{opacity:0}

.icon-btn{transition:transform var(--dur-standard) var(--ease-release),background-color var(--dur-micro) var(--ease-micro)}
.icon-btn:active{transform:scale(.9);transition-duration:80ms;transition-timing-function:var(--ease-micro)}

.check-answer{transition:transform var(--dur-standard) var(--ease-release),box-shadow var(--dur-micro) var(--ease-micro)}

.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;box-shadow:0 8px 0 var(--brand-dark)}

.icon{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-3px}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.045)}100%{transform:scale(1)}}

</style></head><body>
<a href="#main-content" class="skip-link">Skip to question</a>

  </div>
</div></section>

<script>
(function(){
'use strict';
const p=new URLSearchParams(location.search);
const id=p.get('quiz');
const VALID_LEVELS=['a1','a2','b1','b2','c1','c2'];
const rawLevel=(p.get('level')||'a1').toLowerCase();
const level=VALID_LEVELS.indexOf(rawLevel)>=0?rawLevel:'a1';
const mode=(p.get('mode')||'').toLowerCase(); // 'placement' enables recommendation routing
const redirect=p.get('redirect'); // where "Continue" goes to in placement mode
// Course-mode context (Agent 94): course.html/lesson.html pass these when a
// quiz is launched from within a course, so the quiz screen can show a
// slim "Course · Unit" strip. Absent for direct-practice quizzes, which
// keep today's plain header unchanged.
const courseTitleParam=p.get('course');
const unitTitleParam=p.get('unit_title');
const stage=(p.get('stage')||'primary').toLowerCase();

// Reaching the result screen: a very soft "win" chime reveals the result first,
// then (once it finishes, or after a short fallback wait) the score-tier sound follows.
function soundResult(pct){
  if(!soundOn) return;
  // Score quality is deterministic: 60%+ earns the positive result sound;
  // below 60% gets the retry sound. Play the tier sound immediately from the
  // completion click rather than delaying it behind another audio element,
  // which can be blocked by mobile autoplay policies.
  const tier=pct>=60?'great_job.mp3':'try_again.mp3';
  stopAllSounds();
  playSfx(tier,0.95);
}

// While any overlay (loading/start/error/end) covers the screen, the header
// and quiz <main> sit fully hidden behind it but were still in the normal
// tab order and screen-reader reading order — a keyboard or screen-reader
// user could tab straight past the visible modal into invisible controls
// (exit/sound/speed buttons, answer options) underneath it. `inert` removes
// that background content from both focus and the accessibility tree
// whenever a modal is up, and setBackgroundInert(false) restores it the
// moment no overlay is showing (i.e. during live quiz play).
function setBackgroundInert(isInert){
  [document.querySelector('.header'),document.querySelector('main')].forEach(el=>{
    if(!el)return;
    if(isInert)el.setAttribute('inert','');else el.removeAttribute('inert');
  });
}
function escStrip(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

    (unitTitleParam?'<span class="sep">·</span><span>'+escStrip(unitTitleParam)+'</span>':'');
  el.classList.add('visible');
}

function show(section){
  ['loading','start','error','end'].forEach(s=>{
    const el=$(s);
    if(s===section){
      el.style.display='grid';
      el.classList.remove('anim-in');
      void el.offsetWidth; // reflow, so the entrance animation replays every time
      el.classList.add('anim-in');
    }else{
      el.style.display='none';
      el.classList.remove('anim-in');
    }
  });
  setBackgroundInert(!!section);
  // Agent 90: bottom nav stays visible on the pre-start/results/error/loading
  // overlays and hides only during an in-progress question (section===null),
  // so learners can't accidentally tab away mid-question but the nav is
  // otherwise present everywhere in the quiz flow.
  if(window.MylingoAppShell) window.MylingoAppShell.setVisible(!!section);
}

function homeUrl(){return './../'+level+'/index.html'}
// The course/journey/homepage layer passes ?redirect=... so a lesson or
// journey exercise returns the learner to that exact context instead of the
// bare level index (this is how "Resume returns to the correct lesson"
// holds across the lesson -> quiz -> lesson/journey/homepage loop). Only a
// same-site relative path is accepted: redirect is reflected from the URL,
// so anything else (a scheme, a protocol-relative //host, javascript:) is
// rejected and the safe homeUrl() fallback is used instead.
function isSafeRedirect(url){return typeof url==='string' && /^\.\.?\//.test(url) && !/^[a-z][a-z0-9+.-]*:/i.test(url) && url.indexOf('//')!==0;}
function backTarget(){return isSafeRedirect(redirect)?redirect:homeUrl();}
$('exitBtn').onclick=()=>{stopAllSounds();location.href=backTarget()};

function gp(){try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');return (v&&typeof v==='object')?v:{}}catch(e){return{}}}
function sessionShardKey(quizId){return SESSION_SHARD_PREFIX+encodeURIComponent(String(quizId||''));}
function readSessionIndex(){
  try{
    const v=JSON.parse(localStorage.getItem(SESSION_INDEX_KEY)||'null');
    if(v&&v.version===1&&Array.isArray(v.quizIds)) return v;
  }catch(e){}
  return {version:1,quizIds:[]};
}
function writeSessionIndex(index){
  localStorage.setItem(SESSION_INDEX_KEY,JSON.stringify({version:1,quizIds:Array.from(new Set(index.quizIds||[])).filter(Boolean)}));
}
function migrateSessionShards(){
  const index=readSessionIndex();
  if(index.quizIds.length) return index;
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    const v=JSON.parse(raw||'null');
    if(v&&typeof v==='object'&&v.version===2&&v.sessions&&typeof v.sessions==='object'){
      const ids=Object.keys(v.sessions);
      ids.forEach(id=>localStorage.setItem(sessionShardKey(id),JSON.stringify(v.sessions[id])));
      if(ids.length) writeSessionIndex({version:1,quizIds:ids});
      localStorage.removeItem(SESSION_KEY);
      return {version:1,quizIds:ids};
    }
  }catch(e){}
  try{
    const legacy=JSON.parse(localStorage.getItem(LEGACY_SESSION_KEY)||'null');
    if(legacy&&typeof legacy==='object'&&legacy.version===1&&legacy.quizId){
      localStorage.setItem(sessionShardKey(legacy.quizId),JSON.stringify(legacy));
      writeSessionIndex({version:1,quizIds:[legacy.quizId]});
      localStorage.removeItem(LEGACY_SESSION_KEY);
      return {version:1,quizIds:[legacy.quizId]};
    }
  }catch(e){}
  return index;
}
function readSessionStore(){
  const index=migrateSessionShards();
  const sessions={};
  index.quizIds.forEach(id=>{
    try{
      const v=JSON.parse(localStorage.getItem(sessionShardKey(id))||'null');
      if(v&&typeof v==='object') sessions[id]=v;
    }catch(e){}
  });
  return {version:3,sessions};
}
function sanitizeSession(v){
  if(!v||typeof v!=='object'||v.version!==1||v.status!=='in-progress'||typeof v.quizId!=='string'||typeof v.quizVersion!=='string'||!Number.isInteger(v.questionIndex)||!Array.isArray(v.answers)||!Number.isFinite(v.score)||!Number.isFinite(v.startedAt)||!Number.isFinite(v.updatedAt)) return null;
  return v;
}
function readSession(quizId){
  if(!quizId)return null;
  try{
    migrateSessionShards();
    const v=JSON.parse(localStorage.getItem(sessionShardKey(quizId))||'null');
    return sanitizeSession(v);
  }catch(e){return null}
}
function sessionForCurrentQuiz(){
  const v=readSession(data&&data.id);
  if(!v||!data)return null;
  const expectedVersion=String(data.version||1);
  if(v.quizId!==data.id||v.quizVersion!==expectedVersion||v.questionIndex<0||v.questionIndex>=data.questions.length||v.answers.length!==data.questions.length||v.score<0||v.score>gradedTotal()){
    clearSession(data.id);
    return null;
  }
  return v;
}
function writeSession(quizId,session){
  try{
    if(!quizId)return false;
    const index=migrateSessionShards();
    const ids=index.quizIds||[];
    const pos=ids.indexOf(quizId);
    if(session){
      localStorage.setItem(sessionShardKey(quizId),JSON.stringify(session));
      if(pos<0) ids.push(quizId);
    }else{
      localStorage.removeItem(sessionShardKey(quizId));
      if(pos>=0) ids.splice(pos,1);
    }
    writeSessionIndex({version:1,quizIds:ids});
    return true;
  }catch(e){return false}
}
function clearSession(quizId){
  try{
    if(quizId){writeSession(quizId,null);return;}
    const id=data&&data.id;
    if(id) writeSession(id,null);
  }catch(e){}
}
function saveSession(){
  if(!data||!sessionStartedAt)return;
  const current=readSession(data.id);
  const answers=Array.isArray(current&&current.answers)?current.answers.slice():Array(data.questions.length).fill(null);
  answers.length=data.questions.length;
  answers[i]=answers[i]||null;
  writeSession(data.id,{version:1,quizId:data.id,quizVersion:String(data.version||1),questionIndex:i,answers,score,status:'in-progress',startedAt:sessionStartedAt,updatedAt:Date.now()});
}
function updateSessionAnswer(input,ok,correctText){
  if(!data||restoringSessionAnswer)return;
  try{
    const current=readSession(data.id);
    const answers=Array.isArray(current&&current.answers)?current.answers.slice():Array(data.questions.length).fill(null);
    answers.length=data.questions.length;
    answers[i]={response:input,correct:!!ok,correctText:String(correctText??''),submittedAt:Date.now()};
    writeSession(data.id,{version:1,quizId:data.id,quizVersion:String(data.version||1),questionIndex:i,answers,score,status:'in-progress',startedAt:sessionStartedAt||Date.now(),updatedAt:Date.now()});
  }catch(e){ /* storage unavailable - quiz still works */ }
}
function save(done){
  try{
    const x=gp(),old=x[data.id]||{},graded=gradedTotal(),pct=graded?Math.round(score/graded*100):100;
    x[data.id]={
      id:data.id,title:data.title,level:data.level,
      current:done?data.questions.length:i,score,
      latest:done?pct:(old.latest??null),
      best:done?Math.max(old.best||0,pct):(old.best??null),
      status:done?'completed':'in-progress',
      attempts:done?(old.attempts||0)+1:(old.attempts||0),
      version:data.version||1,
      lastAccess:Date.now(),
      totalQuestions:data.questions.length
    };
    localStorage.setItem(KEY,JSON.stringify(x));
  }catch(e){ /* storage unavailable (private mode / quota) - fail silently, quiz still works */ }
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function questionText(q){return typeof q.question_text==='string'?q.question_text:(typeof q.question==='string'?q.question:'')}
function rawType(q){
  const t=String(q.question_type||'radio').toLowerCase().replace(/[\s-]+/g,'_');
  if(t==='comparison'){
    if(Array.isArray(q.pairs)||Array.isArray(q.matches)) return 'matching';
    if(Array.isArray(q.correctIndices)) return 'checkbox';
    return q.acceptedAnswers||q.correctAnswer||q.answer?'text':'radio';
  }
  if(t==='reorganizer'||t==='reorganizer_task') return 'ranking';
  if(t==='complete_question'||t==='complete-question') return 'fill_in_the_blank';
  return t||'radio';
}
function normalizeText(v){return String(v??'').trim().replace(/\s+/g,' ').toLowerCase()}
function mediaValue(q,key){
  const m=q&&q.media&&typeof q.media==='object'?q.media:null;
  const value=m&&m[key]!=null?m[key]:q&&q[key+'Url'];
  if(value&&typeof value==='object') return {src:value.src||value.url||'',alt:value.alt||value.label||'',label:value.label||''};
  return {src:typeof value==='string'?value:'',alt:q&&q[key+'Alt']||'',label:''};
}
function questionHTML(text){
  return esc(text).split(/_{3,}/).join('<span class="blank">______</span>');
}
function answerList(q){
  const a=Array.isArray(q.answers)?q.answers:(Array.isArray(q.options)?q.options:[]);
  return a.map(x=>typeof x==='object'?String(x.text??x.label??''):String(x));
}
function correctIndexes(q,answers){
  if(Array.isArray(q.correctIndices)) return q.correctIndices.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=answers.length).sort((a,b)=>a-b);
  const fromObjects=(Array.isArray(q.answers)?q.answers:[]).map((x,i)=>x&&typeof x==='object'&&(x.is_correct===true||x.isCorrect===true)?i+1:null).filter(Boolean);
  if(fromObjects.length)return fromObjects;
  if(Number.isInteger(q.correctIndex))return [q.correctIndex];
  return [];
}
function acceptedAnswers(q){
  let a=q.acceptedAnswers;
  if(a==null)a=q.accepted_answers;
  if(a==null && q.correctAnswer!=null)a=[q.correctAnswer];
  if(a==null && q.correct_answer!=null)a=[q.correct_answer];
  if(a==null && q.answer!=null)a=[q.answer];
  if(a==null && Array.isArray(q.answers)&&!Number.isInteger(q.correctIndex))a=q.answers;
  return Array.isArray(a)?a:[a].filter(v=>v!=null);
}

function validate(d){
  if(!d||typeof d!=='object') return 'Quiz data is not a valid object.';
  if(!Array.isArray(d.questions)||d.questions.length===0) return 'This quiz has no questions.';
  for(const q of d.questions){
    if(!q||typeof q!=='object') return 'A question is invalid.';
    const type=rawType(q),text=questionText(q);
    if(type!=='banner'&&(!text||!text.trim())) return 'A question is missing its text.';
    if(type==='radio'||type==='dropdown'){
      const a=answerList(q),idx=correctIndexes(q,a);
      if(a.length<2||a.length>9) return 'A choice question needs 2–9 answers.';
      if(idx.length!==1||idx[0]<1||idx[0]>a.length) return 'A choice question has an invalid correct answer.';
    }else if(type==='checkbox'){
      const a=answerList(q),idx=correctIndexes(q,a);
      if(a.length<2||a.length>9||!idx.length) return 'A multiple-choice question needs 2–9 answers and at least one correct answer.';
    }else if(type==='text'||type==='short_text'||type==='number'||type==='date'||type==='fill_in_the_blank'){
      if(!acceptedAnswers(q).length) return 'A '+type.replaceAll('_',' ')+' question is missing its accepted answer.';
    }else if(type==='matching'){
      const pairs=Array.isArray(q.pairs)?q.pairs:(Array.isArray(q.matches)?q.matches:[]);
      if(pairs.length<2) return 'A matching question needs at least 2 pairs.';
      if(pairs.some(p=>!p||p.left==null||p.right==null)) return 'A matching question contains an invalid pair.';
    }else if(type==='ranking'){
      const items=Array.isArray(q.items)?q.items:answerList(q);
      const order=Array.isArray(q.correctOrder)?q.correctOrder:items.slice();
      if(items.length<2||order.length!==items.length) return 'A ranking question needs items and a complete correct order.';
    }else if(type!=='banner'){
      return 'Unsupported question type: '+type+'.';
    }
  }
  return null;
}

// The manifest is intentionally lazy: the quiz itself is loaded without
// materializing the whole level index. Suggestions can request the manifest
// later, after the learner reaches the result screen.
function getManifest(){
  if(!window.MylingoRuntimeContentLoader) return Promise.resolve(null);
  return window.MylingoRuntimeContentLoader.loadManifest(level)
    .then(list=>Array.isArray(list)?window.MylingoRuntimeV2.normalizeManifest(list):null)
    .catch(()=>null);
}

function loadSuggestions(){
  if(!data||!data.category) return;
  return getManifest().then(list=>{ if(Array.isArray(list)) suggestPool=list.filter(item=>item.category===data.category&&item.id!==data.id); return suggestPool; });
}

async function resolveQuizPath(quizId){
  // Placement quizzes live in their own per-level folder and are never
  // listed in a level's quizzes.json manifest, so they can't be resolved
  // by the generic RuntimeContentLoader. Match any placement-* id, not
  // just the one that happens to exist today, so new placement quizzes
  // added later don't silently 404.
  if(/^placement-[a-z0-9_-]+$/i.test(String(quizId||''))) return '../placement/'+encodeURIComponent(level)+'/'+encodeURIComponent(quizId)+'.json';
  return null; // RuntimeContentLoader resolves the normal content route lazily.
}


async function load(){
  show('loading');
  if(!id){errorState('No quiz to load','We couldn\'t find a quiz in this link. Head back and pick one from the list.',false);return}
  let json;
  try{
    const placementPath=await resolveQuizPath(id);
    if(placementPath){
      const res=await fetch(placementPath,{cache:'no-store'});
      if(!res.ok) throw Object.assign(new Error('placement unavailable'),{status:res.status});
      json=await res.json();
    }else{
      json=await window.MylingoRuntimeContentLoader.load(level,id);
    }
  }catch(e){
    if(e&&e.status===404) errorState('Quiz not found','We can\'t find this quiz. It may have been moved or removed — try picking another one.',false);
    else errorState('Connection problem','We couldn\'t reach the quiz file. Check your connection and try again.',true);
    return;
  }
  let normalized;
  try{normalized=window.MylingoRuntimeV2.normalizeQuiz(json,{level:level})}catch(e){errorState('Quiz data error','This quiz file is corrupted and can\'t be read.',false);return}
  const err=validate(normalized);
  if(err){errorState('Quiz data error',err,false);return}
  data=normalized;
  document.title='Mylingo · '+data.title;
  $('titleTop').textContent=data.title;
  $('startTitle').textContent=data.title;
  $('desc').textContent=(data.questions.length+' questions · ')+(data.description||'Practice and improve your English.');
  $('level').textContent=data.level||level.toUpperCase();
  if(data.category){$('categoryBadge').textContent=data.category;$('categoryBadge').style.display='inline-block'}
  show('start');
  configureStart();
  $('startBtn').focus();
}

function configureStart(){
  const session=sessionForCurrentQuiz();
  const hasResume=!!session;
  $('resumeBtn').style.display=hasResume?'inline-flex':'none';
  $('startBtn').textContent=hasResume?'Start over':'Start quiz';
}

function startFresh(){
  clearSession();
  sessionStartedAt=Date.now();
  i=0;score=0;answerCorrect={};$('score').textContent=0;$('score').classList.remove('text-pop');
  stopAllSounds();show(null);document.querySelectorAll('.overlay').forEach(o=>o.style.display='none');render();saveSession();
}

function resumeSession(){
  const session=sessionForCurrentQuiz();
  if(!session){configureStart();return startFresh()}
  sessionStartedAt=session.startedAt;
  i=session.questionIndex;score=session.score;answerCorrect={};
  session.answers.forEach((entry,n)=>{if(entry&&typeof entry==='object'&&typeof entry.correct==='boolean')answerCorrect[n]=entry.correct});
  setTextSmooth($('score'),score);
  stopAllSounds();show(null);document.querySelectorAll('.overlay').forEach(o=>o.style.display='none');render();
  const entry=session.answers[i];
  if(entry&&entry.response&&typeof entry.response==='object'&&typeof entry.correct==='boolean'){
    applyResponseToUI(entry.response);
    restoringSessionAnswer=true;
    try{finishAnswer(entry.correct,entry.correctText||'',entry.response)}finally{restoringSessionAnswer=false}
  }
}

function errorState(title,msg,retryable){
  $('errTitle').textContent=title;$('errMsg').textContent=msg;$('retryBtn').style.display=retryable?'inline-block':'none';
  show('error');$('retryBtn').style.display!=='none'?$('retryBtn').focus():$('errHomeBtn').focus();
}
$('retryBtn').onclick=()=>{stopAllSounds();load()};

function gradedTotal(){return Array.isArray(data?.questions)?data.questions.filter(q=>rawType(q)!=='banner').length:0}
function clearQuestionUI(){
  // renderChoice() sets #options' role to 'radiogroup'/'group' for
  // radio/checkbox questions but nothing ever resets it, so a radio question
  // followed by a text/matching/ranking/banner question left the container
  // announced as a "radio group" to screen readers even though it now holds
  // a text input, select dropdowns, or a ranking list. Reset to a neutral
  // 'group' on every question change; renderChoice() re-specializes it when
  // the next question actually is radio/checkbox.
  const box=$('options');
  box.innerHTML='';
  box.setAttribute('role','group');
  box.setAttribute('aria-label','Answer options');
  $('feedback').className='feedback';$('feedback').textContent='';
  $('next').style.display='none';$('next').classList.remove('show');
  $('kbHint').textContent='';
}
function renderMedia(q){
  const img=mediaValue(q,'image'),iw=$('qimgWrap');
  if(img.src){$('qimg').src=img.src;$('qimg').alt=img.alt||'';iw.style.display='block';$('qimg').onerror=()=>{iw.style.display='none'}}
  else{iw.style.display='none';$('qimg').removeAttribute('src')}
  const au=mediaValue(q,'audio'),aw=$('qaudioWrap');
  if(au.src){$('qaudio').src=au.src;$('qaudio').setAttribute('aria-label',au.label||'Question audio');$('qaudioLabel').textContent=au.label||'Listen';aw.style.display='block'}
  else{aw.style.display='none';$('qaudio').removeAttribute('src');$('qaudio').load()}
}
function makeCheckButton(onclick,label='Check answer'){
  const wrap=document.createElement('div');wrap.className='answer-actions';
  const b=document.createElement('button');b.type='button';b.className='check-answer';b.textContent=label;b.addEventListener('click',onclick);wrap.appendChild(b);return wrap;
}
function renderChoice(q,type){
  const answers=answerList(q),box=$('options');
  box.className=type==='dropdown'?'options':'options';
  if(type==='dropdown'){
    const card=document.createElement('div');card.className='input-card';

function submitAnswer(input){
  if(locked)return;
  const q=data.questions[i],type=rawType(q),answers=answerList(q);
  let ok=false,correctText='',response=input;
  if(type==='radio'||type==='dropdown'){
    const idx=input.index;if(!idx)return;
    const ci=correctIndexes(q,answers)[0];ok=idx===ci;correctText=answers[ci-1];
  }else if(type==='checkbox'){
    const got=(input.indices||[]).map(Number).sort((a,b)=>a-b),want=correctIndexes(q,answers);
    ok=got.length===want.length&&got.every((v,n)=>v===want[n]);correctText=want.map(n=>answers[n-1]).join(', ');
  }else if(type==='text'||type==='short_text'||type==='fill_in_the_blank'){
    const accepted=acceptedAnswers(q).map(String);ok=accepted.some(a=>normalizeText(a)===normalizeText(input.value));correctText=accepted[0]||'';
  }else if(type==='number'){
    const accepted=acceptedAnswers(q).map(Number),tol=Number(q.tolerance??q.acceptableRange??0);ok=accepted.some(a=>Number.isFinite(a)&&Number.isFinite(Number(input.value))&&Math.abs(Number(input.value)-a)<=tol);correctText=String(accepted[0]??'');
  }else if(type==='date'){
    const accepted=acceptedAnswers(q).map(String);ok=accepted.some(a=>String(a)===String(input.value));correctText=accepted[0]||'';
  }else if(type==='matching'){
    const pairs=Array.isArray(q.pairs)?q.pairs:q.matches;const got=input.matching||[];
    ok=got.length===pairs.length&&pairs.every(p=>got.some(g=>normalizeText(g.left)===normalizeText(p.left)&&normalizeText(g.right)===normalizeText(p.right)));correctText=pairs.map(p=>p.left+' → '+p.right).join(', ');
  }else if(type==='ranking'){
    const want=(Array.isArray(q.correctOrder)?q.correctOrder:(Array.isArray(q.items)?q.items:answers)).map(String),got=(input.ranking||[]).map(String);
    const norm=v=>String(v||'').trim().replace(/\s+/g,' ').toLowerCase();
    ok=got.length===want.length&&got.every((v,n)=>norm(v)===norm(want[n]));correctText=want.join(' → ');

function end(){
 // Agent 102: everything below computes/renders the results screen, but none
 // of it is allowed to prevent the transition out of the hidden-nav,
 // mid-question state (show(null) was the last call before end() runs — see
 // the advance-or-finish branch that calls end()). Without this try/finally,
 // any uncaught throw in the unguarded lines below (e.g. a missing
 // '.result-ring' node) would leave the learner on a blank screen with the
 // bottom nav permanently hidden and no way back except a manual reload —
 // the exact class of mid-question nav-hide gap Agent 99 flagged as still
 // needing a traced path rather than an assumed-safe one.
 try{
  $('bar').style.width='100%';
  $('progressWrap').setAttribute('aria-valuenow','100');
  const graded=gradedTotal();
  const pct=graded?Math.round(score/graded*100):100;
  $('finalPct').textContent=pct+'%';
  $('end').querySelector('.result-ring').style.setProperty('--score-angle',Math.round(pct*3.6)+'deg');
  $('result').textContent=congratsTitle(pct);
  $('message').textContent='You scored '+score+' out of '+graded+' ('+pct+'%).';
  save(true);
  clearSession(data.id);
  soundResult(pct);

  // Gamification is purely additive: if the module didn't load for any
  // reason, the quiz still saves and completes normally.
  try{
    if(window.MylingoGamification){
      const g=window.MylingoGamification.recordSession(score,graded,new Date(),{quizId:data.id,quizVersion:String(data.version||1),mode});
      const box=$('gamifyBadges');
      box.innerHTML='<span class="badge">+'+g.xpEarned+' XP</span>'+
        '<span class="badge neutral"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;display:inline-block" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg> '+g.streak+' day'+(g.streak===1?'':'s')+'</span>';
      box.style.display='flex';
    }
  }catch(e){ /* never let gamification break the results screen */ }

  // Skill mastery is additive and best-effort: it never blocks quiz completion.
  try{
    if(window.MylingoSkillMastery){
      window.MylingoSkillMastery.recordAndPersist({
        quiz_id:data.id, level:data.level||level, questions:data.questions,
        correctMap:answerCorrect, timestamp:Date.now()
      });
    }
  }catch(e){ /* mastery storage must never break the results screen */ }

  // Review scheduling is additive and disabled for placement assessments.
  try{
    if(mode!=='placement' && window.MylingoReviewScheduler){
      window.MylingoReviewScheduler.recordAndPersist({
        quiz_id:data.id, level:data.level||level, questions:data.questions,
        correctMap:answerCorrect, timestamp:Date.now()
      });
    }
  }catch(e){ /* review storage must never break the results screen */ }

  if(mode==='placement'){
    const profile=saveAssessmentResult(pct);
    renderPlacementResult(profile);
    renderPlacementRecommendations(profile);
    placementContinue(profile);
    // No "more Placement practice" suggestions exist (placement quizzes
    // aren't listed in a level's manifest), so don't call renderSuggestions()
    // here — see the guard in renderSuggestions() for why this used to spin.
  }else{
    $('reco').style.display='none';
    $('continueBtn').style.display='none';
    renderSuggestions();
  }
 }finally{
  // Always fires, even on an uncaught throw above: nav returns and the end
  // overlay is shown no matter how incomplete its contents ended up being.
  show('end');
  $('result').focus?.();
 }
}

function setTextSmooth(el,val){
  if(!el||el.textContent===String(val))return;
  el.textContent=val;
  el.classList.remove('text-pop');
  void el.offsetWidth;
  el.classList.add('text-pop');
}

$('startBtn').onclick=startFresh;
$('resumeBtn').onclick=resumeSession;
$('next').onclick=()=>{stopAllSounds();next()};
$('again').onclick=()=>{startFresh()};

load();
})();
</script>
</body></html>
