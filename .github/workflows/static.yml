      - name: Prepare MYLINGO website
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MYLINGO DEPLOYMENT DIAGNOSTICS"
          echo "========================================"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Working directory:"
          pwd

          echo ""
          echo "Repository root:"
          ls -la

          echo ""
          echo "Checking site directory..."

          if [ ! -d "site" ]; then
            echo "ERROR: site/ directory does not exist."
            echo "Available directories:"
            find . -maxdepth 2 -type d | sort
            exit 1
          fi

          echo "site/ exists."

          echo ""
          echo "site/ contents:"
          ls -la site

          echo ""
          echo "Checking required MYLINGO files..."

          REQUIRED_FILES=(
            "site/index.html"
            "site/main/index.html"
            "site/manifest.json"
            "site/sw.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "MISSING: $FILE"
              exit 1
            fi
          done

          echo ""
          echo "All required MYLINGO files found."

          rm -rf _site
          mkdir -p _site

          cp -R site/. _site/

          echo ""
          echo "Checking deployment artifact..."

          for FILE in \
            "_site/index.html" \
            "_site/main/index.html" \
            "_site/manifest.json" \
            "_site/sw.js"
          do
            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "ERROR: deployment file missing: $FILE"
              exit 1
            fi
          done

          echo ""
          echo "========================================"
          echo "MYLINGO SITE PREPARATION SUCCESSFUL"
          echo "========================================"
