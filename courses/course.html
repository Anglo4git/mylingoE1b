<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../shared/brand/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../shared/brand/favicon-192.png">
<link rel="apple-touch-icon" href="../shared/brand/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1959d1">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}</script>
<title>Mylingo · Course</title>
<style>
:root{--brand:#1959d1;--brand-dark:#0e45ae;--brand-soft:#eaf1fc;--success:#58cc02;--success-dark:#46a302;--success-soft:#e9f8df;--ink:#17212b;--muted:#4b5563;--line:#e5e7eb;--bg:#f7f9fc;--ease-micro:cubic-bezier(0.25,0.1,0.25,1);--ease-release:cubic-bezier(0.34,1.56,0.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
a{color:inherit}
.skip-link{position:absolute;left:8px;top:-48px;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;text-decoration:none;z-index:1000;transition:top .15s ease}
.skip-link:focus{top:8px}
header{padding:22px 16px;background:#fff;border-bottom:1px solid var(--line);padding-top:calc(22px + env(safe-area-inset-top))}
.headrow{max-width:800px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand-logo{height:26px;width:auto;display:block}
.headrow nav a{font-size:13px;font-weight:700;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:12px 16px;display:inline-flex;align-items:center;min-height:44px}
main{max-width:800px;margin:auto;padding:20px 16px 60px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 10px}
.crumb a{color:var(--brand);text-decoration:none;font-weight:700}
.lvl{display:inline-block;font-size:11px;font-weight:900;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:3px 10px;margin-bottom:8px}
h1{margin:0 0 6px;font-size:26px}
.desc{color:var(--muted);margin:0 0 16px;max-width:60ch}
.practice-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{font-size:12px;font-weight:700;background:#f1f3f5;border-radius:99px;padding:6px 12px}
.statcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat .n{font-size:22px;font-weight:900}
.stat .l{color:var(--muted);font-size:12px}
.bar{height:10px;background:#edf0f3;border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.pctrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 auto;text-align:center;text-decoration:none;font-weight:800;font-size:14px;padding:13px 16px;border-radius:99px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;transition:transform 220ms var(--ease-release)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:#fff}
.btn.secondary{background:#f1f3f5;color:var(--ink)}
.section-title{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:28px 0 12px}
/* Roadmap connector line (Agent 93): a vertical line running behind the
   unit cards, so the unit list reads as a path rather than a flat list.
   Kept lightweight — units/lessons themselves are unchanged, this only
   adds visual context around the existing .unit cards. */
.roadmap{position:relative;padding-left:22px}
.roadmap::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.roadmap .unit{position:relative}
.roadmap .unit::before{content:"";position:absolute;left:-22px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.roadmap .unit.unit-completed::before{background:var(--success)}
.unit{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.unit>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;min-height:44px}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary .uinfo{display:flex;align-items:center;gap:10px;min-width:0}
.unit>summary .uinfo span.count{font-weight:600;color:var(--muted);font-size:12px}
.unit>summary .chev{transition:transform 160ms var(--ease-micro);flex:0 0 auto}
.unit[open]>summary .chev{transform:rotate(90deg)}
.ubar{width:64px;height:6px;background:#edf0f3;border-radius:99px;overflow:hidden;flex:0 0 auto}
.ubar i{display:block;height:100%;background:var(--success)}
.lesson-list{list-style:none;margin:0;padding:0 18px 14px}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lesson .meta{flex:1;min-width:0}
.lesson b{display:block;font-size:14px}
.lesson small{color:var(--muted);font-size:12px}
.status{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;flex:0 0 auto;white-space:nowrap}
.status.completed{background:var(--success-soft);color:#2f6d06}
.status.in-progress{background:#fff7e0;color:#8a6100}
.status.not-started{background:#f1f3f5;color:var(--muted)}
.lesson a.practice{flex:0 0 auto;text-decoration:none;font-weight:800;font-size:12px;color:var(--brand);border:1px solid var(--brand-soft);background:var(--brand-soft);border-radius:99px;padding:8px 12px;min-height:36px;display:inline-flex;align-items:center}
.loading{text-align:center;color:var(--muted);padding:60px 20px}
.err{text-align:center;color:var(--muted);padding:50px 20px}
.err a{color:var(--brand);font-weight:800;text-decoration:none}
footer{max-width:800px;margin:0 auto;padding:24px 16px 40px;color:var(--muted);font-size:13px;text-align:center}
@media(prefers-reduced-motion:reduce){.btn,.chev{transition:none}.btn:active{transform:none}}
@view-transition{navigation:auto}
::view-transition-old(root){animation:page-out .28s cubic-bezier(.4,0,.2,1) both}
::view-transition-new(root){animation:page-in .28s cubic-bezier(.4,0,.2,1) both}
@keyframes page-out{to{opacity:0;transform:scale(.96)}}
@keyframes page-in{from{opacity:0;transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}
</style><link rel="stylesheet" href="../shared/css/app-shell.css"></head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header><div class="headrow">
  <img class="brand-logo" src="../shared/brand/logo-horizontal.svg" alt="Mylingo">
  <nav><a href="./index.html">All courses</a> <a id="journeyLink" href="./journey.html">Journey</a></nav>
</div></header>
<main id="main-content">
  <p class="crumb"><a href="./index.html">Courses</a> / <span id="crumbLevel">…</span></p>
  <div id="content"><div class="loading" role="status" aria-live="polite">Loading course…</div></div>
</main>
<footer>Mylingo · Works offline once installed · Free forever</footer>
<script>
(function(){
'use strict';
var $=function(x){return document.getElementById(x)};
var PROGRESS_KEY='mylingo.progress.v1';
var VALID_LEVELS=['a1','a2','b1','b2','c1','c2'];
var LEVEL_LABEL={A1:'Beginner',A2:'Elementary',B1:'Intermediate',B2:'Upper-intermediate',C1:'Advanced',C2:'Proficiency'};
var params=new URLSearchParams(location.search);
var openUnit=params.get('unit');
var rawLevel=(params.get('level')||'').toLowerCase();
var level=VALID_LEVELS.indexOf(rawLevel)>=0?rawLevel:null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

function readProgress(){
  try{ var v=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}'); return (v&&typeof v==='object')?v:{} }catch(e){ return {} }
}

function fetchJson(url){
  return fetch(url,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json() });
}

function renderError(message){
  $('content').innerHTML='<div class="err"><p>'+esc(message)+'</p><p><a href="./index.html">Back to all courses</a> or <a href="../main/index.html">find my level</a>.</p></div>';
}

function statusFor(exerciseIds,progress){
  if(!exerciseIds.length) return 'not-started';
  var completed=exerciseIds.every(function(id){ return progress[id] && progress[id].status==='completed' });
  if(completed) return 'completed';
  var started=exerciseIds.some(function(id){ return !!progress[id] });
  return started ? 'in-progress' : 'not-started';
}

function statusLabel(s){
  return s==='completed'?'Completed':s==='in-progress'?'In progress':'Not started';
}

function quizUrl(quizId,lvl,backUrl){
  return '../shared/quiz.html?quiz='+encodeURIComponent(quizId)+'&level='+encodeURIComponent(lvl)+'&redirect='+encodeURIComponent(backUrl);
}

// Lessons route through the revision page (Agent 76), not straight to the
// quiz runtime. lesson.html itself starts the first exercise (via the same
// quizUrl() shape) once the learner clicks "Start exercises" or "Skip
// revision" there — this page only has to get them to the right lesson.
function lessonUrl(lessonId,lvl,backUrl){
  return './lesson.html?lesson='+encodeURIComponent(lessonId)+'&level='+encodeURIComponent(lvl)+'&redirect='+encodeURIComponent(backUrl);
}

if(!level){
  renderError('No course level was specified.');
  return;
}

Promise.all([
  fetchJson('../course_content/courses.json'),
  fetchJson('../course_content/units.json'),
  fetchJson('../course_content/lessons.json'),
  fetchJson('../'+level+'/quizzes.json').catch(function(){ return [] })
]).then(function(results){
  var courses=results[0], allUnits=results[1], allLessons=results[2], quizList=results[3];
  var course=courses.find(function(c){ return c.level.toLowerCase()===level && c.status==='published' });
  if(!course){ renderError('This course isn\u2019t available yet.'); return }

  document.title='Mylingo · '+course.title;
  $('crumbLevel').textContent=course.title;
  $('journeyLink').href='./journey.html?level='+encodeURIComponent(level);

  var quizMap={};
  (quizList||[]).forEach(function(q){ quizMap[q.id]=q });

  var units=allUnits.filter(function(u){ return u.course_id===course.course_id }).sort(function(a,b){ return a.order-b.order });
  var unitLessons={};
  units.forEach(function(u){
    unitLessons[u.unit_id]=allLessons.filter(function(l){ return l.unit_id===u.unit_id && l.status==='published' }).sort(function(a,b){ return a.order-b.order });
  });

  var progress=readProgress();
  var allLessonsFlat=[];
  units.forEach(function(u){ unitLessons[u.unit_id].forEach(function(l){ allLessonsFlat.push({unit:u,lesson:l}) }) });

  var totalLessons=allLessonsFlat.length;
  var exerciseIdsAll=[]; allLessonsFlat.forEach(function(x){ (x.lesson.exercise_quiz_ids||[]).forEach(function(id){ exerciseIdsAll.push(id) }) });
  var completedLessons=allLessonsFlat.filter(function(x){ return statusFor(x.lesson.exercise_quiz_ids||[],progress)==='completed' }).length;
  var pct=totalLessons ? Math.round(completedLessons/totalLessons*100) : 0;

  var next=allLessonsFlat.find(function(x){ return statusFor(x.lesson.exercise_quiz_ids||[],progress)!=='completed' });
  var backUrl='../courses/course.html?level='+level;
  var ctaHtml;
  if(next && next.lesson.exercise_quiz_ids && next.lesson.exercise_quiz_ids.length){
    var ctaLabel=completedLessons>0 ? 'Continue: '+esc(next.lesson.title) : 'Start course';
    ctaHtml='<a class="btn primary" href="'+lessonUrl(next.lesson.lesson_id,level,backUrl+'&unit='+encodeURIComponent(next.unit.unit_id))+'">'+ctaLabel+'</a>';
  } else if(totalLessons){
    ctaHtml='<a class="btn primary" href="../'+level+'/index.html">Course complete \u2014 practice again</a>';
  } else {
    ctaHtml='';
  }

  var categories=[]; units.forEach(function(u){ if(categories.indexOf(u.title)<0) categories.push(u.title) });

  var unitsHtml=units.map(function(u){
    var ls=unitLessons[u.unit_id];
    var uCompleted=ls.filter(function(l){ return statusFor(l.exercise_quiz_ids||[],progress)==='completed' }).length;
    var uPct=ls.length?Math.round(uCompleted/ls.length*100):0;
    var isOpen=(openUnit===u.unit_id) || (!openUnit && next && next.unit.unit_id===u.unit_id);
    var lessonsHtml=ls.map(function(l){
      var ids=l.exercise_quiz_ids||[];
      var st=statusFor(ids,progress);
      var exCount=ids.reduce(function(sum,id){ return sum+((quizMap[id]&&quizMap[id].questions)||0) },0);
      var practiceUrl=ids.length?lessonUrl(l.lesson_id,level,backUrl+'&unit='+encodeURIComponent(u.unit_id)):null;
      return '<li class="lesson">'+
        '<div class="meta"><b>'+esc(l.title)+'</b><small>'+esc(l.category)+' \u00b7 '+ids.length+' exercise'+(ids.length===1?'':'s')+(exCount?' \u00b7 '+exCount+' question'+(exCount===1?'':'s'):'')+'</small></div>'+
        '<span class="status '+st+'">'+statusLabel(st)+'</span>'+
        (practiceUrl?'<a class="practice" href="'+practiceUrl+'">'+(st==='completed'?'Review':'Practice')+'</a>':'')+
      '</li>';
    }).join('');
    return '<details class="unit'+(uPct>=100&&ls.length?' unit-completed':'')+'"'+(isOpen?' open':'')+'>'+
      '<summary><span class="uinfo"><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><span>'+esc(u.title)+'</span><span class="count">'+ls.length+' lesson'+(ls.length===1?'':'s')+'</span></span><span class="ubar"><i style="width:'+uPct+'%"></i></span></summary>'+
      '<ul class="lesson-list">'+lessonsHtml+'</ul>'+
    '</details>';
  }).join('');

  $('content').innerHTML=
    '<span class="lvl">'+esc(course.level)+' \u00b7 '+esc(LEVEL_LABEL[course.level]||'')+'</span>'+
    '<h1>'+esc(course.title)+'</h1>'+
    '<p class="desc">'+esc(course.description)+'</p>'+
    '<div class="practice-chips">'+categories.map(function(c){ return '<span class="chip">'+esc(c)+'</span>' }).join('')+'</div>'+
    '<div class="statcard">'+
      '<div class="stats">'+
        '<div class="stat"><div class="n">'+units.length+'</div><div class="l">Units</div></div>'+
        '<div class="stat"><div class="n">'+totalLessons+'</div><div class="l">Lessons</div></div>'+
        '<div class="stat"><div class="n">'+exerciseIdsAll.length+'</div><div class="l">Exercises</div></div>'+
      '</div>'+
      (totalLessons?'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="pctrow"><span>'+pct+'% complete</span><span>'+completedLessons+' / '+totalLessons+' lessons</span></div>':'')+
      '<div class="actions">'+
        ctaHtml+
        '<a class="btn secondary" href="../'+level+'/index.html">Practice this level directly</a>'+
      '</div>'+
    '</div>'+
    '<h2 class="section-title">Units</h2>'+
    '<div class="roadmap">'+unitsHtml+'</div>';
}).catch(function(){ renderError('This course isn\u2019t available right now.') });
})();
</script>
<script src="../shared/js/app-shell.js"></script></body></html>
