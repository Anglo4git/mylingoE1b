<title>Mylingo · Journey</title>
<style>
:root{--brand:#1959d1;--brand-dark:#0e45ae;--brand-soft:#eaf1fc;--success:#58cc02;--success-dark:#46a302;--success-soft:#e9f8df;--ink:#17212b;--muted:#4b5563;--line:#e5e7eb;--bg:#f7f9fc;--card:#fff;--warning:#8a6100;--warning-soft:#fff7e0;--ease:cubic-bezier(.25,.1,.25,1);--ease-release:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}a{color:inherit}.skip-link{position:absolute;left:8px;top:-48px;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;text-decoration:none;z-index:1000}.skip-link:focus{top:8px}
header{padding:22px 16px;background:#fff;border-bottom:1px solid var(--line);padding-top:calc(22px + env(safe-area-inset-top))}.headrow{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand-logo{height:26px;width:auto;display:block}.headrow nav{display:flex;gap:8px;flex-wrap:wrap}.headrow nav a{font-size:13px;font-weight:700;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:10px 14px;display:inline-flex;align-items:center;min-height:44px}.headrow nav a.active{color:var(--brand);background:var(--brand-soft);border-color:#d8e5fb}
main{max-width:820px;margin:auto;padding:20px 16px 64px}.crumb{font-size:13px;color:var(--muted);margin:0 0 10px}.crumb a{color:var(--brand);text-decoration:none;font-weight:700}.hero{margin-bottom:18px}.lvl{display:inline-block;font-size:11px;font-weight:900;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:4px 10px;margin-bottom:8px}h1{font-size:28px;margin:0 0 6px}.desc{color:var(--muted);margin:0;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.continue{display:flex;align-items:center;justify-content:space-between;gap:16px}.continue-copy{min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900;margin-bottom:6px}.continue h2{font-size:19px;margin:0 0 4px}.continue p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;cursor:pointer;text-align:center;text-decoration:none;font-weight:800;font-size:14px;padding:13px 17px;border-radius:99px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:transform 220ms var(--ease-release)}.btn:active{transform:scale(.97)}.btn.primary{background:var(--brand);color:#fff}.btn.secondary{background:#f1f3f5;color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1 1 180px}
.progress-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:800;margin-bottom:8px}.bar{height:11px;background:#edf0f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}.progress-note{font-size:12px;color:var(--muted);margin:8px 0 0}
.path-title{font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:26px 0 12px;font-weight:900}.unit{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 8px;margin-bottom:14px}.unit-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}.unit-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f1f3f5;color:var(--muted);font-weight:900;flex:0 0 auto}.unit.completed .unit-icon{background:var(--success-soft);color:var(--success-dark)}.unit.current .unit-icon{background:var(--brand-soft);color:var(--brand)}.unit-copy{min-width:0;flex:1}.unit-copy h2{font-size:16px;margin:0 0 3px}.unit-copy p{font-size:12px;color:var(--muted);margin:0}.unit-pct{font-size:12px;font-weight:900;color:var(--muted)}.unit-bar{height:5px;background:#edf0f3;border-radius:99px;overflow:hidden;margin:6px 0 12px 50px}.unit-bar i{display:block;height:100%;background:var(--success)}
.lessons{list-style:none;padding:0;margin:0}.lesson{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.node{width:30px;height:30px;border-radius:50%;border:2px solid #d7dce2;display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted);background:#fff}.lesson.completed .node{background:var(--success);border-color:var(--success);color:#fff}.lesson.current .node{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)}.lesson-copy{min-width:0}.lesson-copy b{display:block;font-size:14px;margin-bottom:2px}.lesson-copy small{display:block;color:var(--muted);font-size:12px}.state{font-size:11px;font-weight:900;border-radius:99px;padding:5px 9px;white-space:nowrap}.state.completed{background:var(--success-soft);color:#2f6d06}.state.current{background:var(--brand-soft);color:var(--brand)}.state.upcoming{background:#f1f3f5;color:var(--muted)}.lesson-actions{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}.lesson-actions a{font-size:12px;font-weight:800;text-decoration:none;color:var(--brand);padding:8px 11px;border-radius:99px;background:var(--brand-soft);min-height:36px;display:inline-flex;align-items:center}.lesson-actions a.direct{background:#f1f3f5;color:var(--ink)}
.empty,.err{text-align:center;color:var(--muted);padding:50px 20px}.err a{color:var(--brand);font-weight:800;text-decoration:none}.loading{text-align:center;color:var(--muted);padding:60px 20px}footer{max-width:820px;margin:auto;padding:24px 16px 40px;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:620px){.continue{align-items:stretch;flex-direction:column}.continue .btn{width:100%}.unit-bar{margin-left:0}.lesson{grid-template-columns:32px minmax(0,1fr)}.lesson .state{grid-column:2;justify-self:start}.lesson-actions{grid-column:2}.headrow nav a{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:active{transform:none}}@view-transition{navigation:auto}@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}
</style><link rel="stylesheet" href="../shared/css/app-shell.css"></head><body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header><div class="headrow"><img class="brand-logo" src="../shared/brand/logo-horizontal.svg" alt="Mylingo"><nav><a class="active" href="#main-content" aria-current="page">Journey</a><a id="courseLink" href="./index.html">Course</a><a href="../main/index.html">All levels</a></nav></div></header>
<main id="main-content"><p class="crumb"><a href="./index.html">Courses</a> / <span id="crumbLevel">…</span> / Journey</p><div id="content"><div class="loading" role="status" aria-live="polite">Loading your journey…</div></div></main>
<footer>Mylingo · The journey guides you, but you can practice any topic directly.</footer>
<script>
(function(){'use strict';
var $=function(x){return document.getElementById(x)},PROGRESS_KEY='mylingo.progress.v1',VALID_LEVELS=['a1','a2','b1','b2','c1','c2'],LEVEL_LABEL={A1:'Beginner',A2:'Elementary',B1:'Intermediate',B2:'Upper-intermediate',C1:'Advanced',C2:'Proficiency'};
var params=new URLSearchParams(location.search),raw=(params.get('level')||'').toLowerCase(),level=VALID_LEVELS.indexOf(raw)>=0?raw:null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function readProgress(){try{var v=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');return v&&typeof v==='object'?v:{}}catch(e){return {}}}
function fetchJson(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})}
function statusFor(ids,p){if(!ids.length)return 'not-started';if(ids.every(function(id){return p[id]&&p[id].status==='completed'}))return 'completed';if(ids.some(function(id){return !!p[id]}))return 'in-progress';return 'not-started'}
function lessonHref(id,unitId){return './lesson.html?lesson='+encodeURIComponent(id)+'&level='+encodeURIComponent(level)+'&redirect='+encodeURIComponent('./journey.html?level='+level+'&unit='+encodeURIComponent(unitId))}
function directHref(ids){return ids.length?'../shared/quiz.html?quiz='+encodeURIComponent(ids[0])+'&level='+encodeURIComponent(level)+'&redirect='+encodeURIComponent('./journey.html?level='+level):null}
function renderError(message){$('content').innerHTML='<div class="err"><p>'+esc(message)+'</p><p><a href="./index.html">Back to courses</a> or <a href="../main/index.html">find my level</a>.</p></div>'}
if(!level){renderError('No course level was specified.');return}
$('courseLink').href='./course.html?level='+encodeURIComponent(level);
Promise.all([fetchJson('../course_content/courses.json'),fetchJson('../course_content/units.json'),fetchJson('../course_content/lessons.json')]).then(function(r){
 var courses=r[0],allUnits=r[1],allLessons=r[2],course=courses.find(function(c){return c.level.toLowerCase()===level&&c.status==='published'});if(!course){renderError('This course isn’t available yet.');return}
 var units=allUnits.filter(function(u){return u.course_id===course.course_id}).sort(function(a,b){return a.order-b.order});
 var lessons=[];units.forEach(function(u){var ls=allLessons.filter(function(l){return l.unit_id===u.unit_id&&l.status==='published'}).sort(function(a,b){return a.order-b.order});ls.forEach(function(l){lessons.push({unit:u,lesson:l})})});
 var progress=readProgress(),lessonStates=lessons.map(function(x){return statusFor(x.lesson.exercise_quiz_ids||[],progress)});
 var completed=lessonStates.filter(function(s){return s==='completed'}).length,total=lessons.length,pct=total?Math.round(completed/total*100):0;
 var currentIndex=lessonStates.findIndex(function(s){return s!=='completed'}),current=currentIndex>=0?lessons[currentIndex]:null;
 var unitModels=units.map(function(u){var ls=lessons.filter(function(x){return x.unit.unit_id===u.unit_id});var done=ls.filter(function(x){return statusFor(x.lesson.exercise_quiz_ids||[],progress)==='completed'}).length;var up=ls.length?Math.round(done/ls.length*100):0;return {unit:u,lessons:ls,done:done,pct:up}});
 document.title='Mylingo · '+course.title+' Journey';$('crumbLevel').textContent=course.title;
 var continueHtml='';
 if(current){var ids=current.lesson.exercise_quiz_ids||[];continueHtml='<section class="card continue"><div class="continue-copy"><div class="eyebrow">Continue learning</div><h2>'+esc(current.lesson.title)+'</h2><p>'+esc(current.unit.title)+' · '+esc(current.lesson.category||'Lesson')+' · '+(currentIndex+1)+' of '+total+' lessons</p></div><a class="btn primary" href="'+lessonHref(current.lesson.lesson_id,current.unit.unit_id)+'">Continue</a></section>'}
 else if(total){continueHtml='<section class="card continue"><div class="continue-copy"><div class="eyebrow">Journey complete</div><h2>You finished '+esc(course.title)+'</h2><p>Keep your skills fresh by practising any topic again.</p></div><a class="btn primary" href="'+encodeURI('../'+level+'/index.html')+'">Practice again</a></section>'}
 else{continueHtml='<section class="card empty"><p>This journey has no published lessons yet.</p></section>'}
 var unitHtml=unitModels.map(function(m,ui){var isCurrent=current&&m.lessons.some(function(x){return x.lesson.lesson_id===current.lesson.lesson_id});var unitClass=m.done===m.lessons.length&&m.lessons.length?'completed':(isCurrent?'current':'');var icon=m.done===m.lessons.length&&m.lessons.length?'✓':(isCurrent?'•':String(ui+1));var lessonsHtml=m.lessons.map(function(x){var idx=lessons.findIndex(function(y){return y.lesson.lesson_id===x.lesson.lesson_id}),st=lessonStates[idx],ids=x.lesson.exercise_quiz_ids||[],href=lessonHref(x.lesson.lesson_id,m.unit.unit_id),direct=directHref(ids),label=st==='completed'?'Completed':(idx===currentIndex?'Current':'Upcoming');return '<li class="lesson '+(st==='completed'?'completed':idx===currentIndex?'current':'upcoming')+'"><span class="node" aria-hidden="true">'+(st==='completed'?'✓':idx===currentIndex?'→':(idx+1))+'</span><div class="lesson-copy"><b>'+esc(x.lesson.title)+'</b><small>'+esc(x.lesson.category||'Lesson')+(ids.length?' · '+ids.length+' exercise'+(ids.length===1?'':'s'):'')+'</small></div><span class="state '+(st==='completed'?'completed':idx===currentIndex?'current':'upcoming')+'">'+label+'</span><div class="lesson-actions"><a href="'+href+'">'+(st==='completed'?'Review':'Open lesson')+'</a>'+(direct?'<a class="direct" href="'+direct+'">Practice this topic</a>':'')+'</div></li>'}).join('');return '<section class="unit '+unitClass+'"><div class="unit-head"><div class="unit-icon" aria-hidden="true">'+icon+'</div><div class="unit-copy"><h2>Unit '+esc(m.unit.order)+' — '+esc(m.unit.title)+'</h2><p>'+m.done+' of '+m.lessons.length+' lessons complete</p></div><div class="unit-pct">'+m.pct+'%</div></div><div class="unit-bar" aria-label="Unit '+esc(m.unit.order)+' progress"><i style="width:'+m.pct+'%"></i></div><ol class="lessons">'+lessonsHtml+'</ol></section>'}).join('');
 $('content').innerHTML='<div class="hero"><span class="lvl">'+esc(course.level)+' · '+esc(LEVEL_LABEL[course.level]||'')+'</span><h1>'+esc(course.title)+' Journey</h1><p class="desc">Follow the next lesson when you want a guided path. Finished lessons stay available for review, and every topic can be practised directly.</p></div>'+continueHtml+'<section class="card"><div class="progress-head"><span>Course progress</span><span>'+pct+'%</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="Course progress"><i style="width:'+pct+'%"></i></div><p class="progress-note">'+completed+' of '+total+' published lessons completed.</p><div class="actions"><a class="btn secondary" href="'+encodeURI('./course.html?level='+level)+'">Explore course</a><a class="btn secondary" href="'+encodeURI('../'+level+'/index.html')+'">Practice this level directly</a></div></section><h2 class="path-title">Your path</h2>'+unitHtml;
}).catch(function(){renderError('Your journey is unavailable right now. Please try again or open the course directly.')});
})();
</script><script src="../shared/js/app-shell.js"></script></body></html>
